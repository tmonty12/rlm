apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: rlm
spec:
  services:
    # === RLM Orchestrator (no GPU) ===
    Orchestrator:
      componentType: default
      replicas: 1
      envs:
        - name: RLM_INFERENCE_URL
          value: "http://rlm-frontend:8000/v1"
        - name: RLM_MODEL_NAME
          value: "Qwen/Qwen3-0.6B"
        - name: RLM_SANDBOX_URL
          value: "http://rlm-sandboxpool:9090"
        - name: RLM_MAX_ITERATIONS
          value: "30"
      extraPodSpec:
        mainContainer:
          image: <registry>/rlm-orchestrator:latest
          command: ["python3", "-m", "uvicorn"]
          args: ["rlm_dynamo.server:app", "--host", "0.0.0.0", "--port", "9090"]
          ports:
            - containerPort: 9090
              name: system
              protocol: TCP

    # === Inference Frontend (OpenAI-compatible API) ===
    Frontend:
      envFromSecret: hf-token-secret
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1

    # === Inference Worker (GPU) ===
    Worker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      resources:
        limits:
          gpu: "1"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          workingDir: /workspace/examples/backends/vllm
          command: ["python3", "-m", "dynamo.vllm"]
          args: ["--model", "Qwen/Qwen3-0.6B"]

    # === Sandbox Pool (code execution, no GPU) ===
    SandboxPool:
      componentType: default
      replicas: 1
      envs:
        - name: RLM_INFERENCE_URL
          value: "http://rlm-frontend:8000/v1"
        - name: RLM_MODEL_NAME
          value: "Qwen/Qwen3-0.6B"
      extraPodSpec:
        mainContainer:
          image: <registry>/rlm-sandbox:latest
          command: ["python3", "-m", "uvicorn"]
          args: ["rlm_dynamo.sandbox:app", "--host", "0.0.0.0", "--port", "9090"]
          ports:
            - containerPort: 9090
              name: system
              protocol: TCP
